
name: Flix Build and Release

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Flix for Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile Flix
        run: cmake --build build --config Release --parallel

      - name: Check Flix compiler version
        run: build/bin/Release/flixc.exe version

      - name: Test conditional branch chains
        shell: pwsh
        run: |
          $compiler = "build/bin/Release/flixc.exe"

          $tests = @(
            @{
              File = "examples/branch_chains.flix"
              Expected = "Great"
            },
            @{
              File = "examples/nested_branches.flix"
              Expected = "Great"
            },
            @{
              File = "examples/logical_continuations.flix"
              Expected = "All conditions passed"
            },
            @{
              File = "examples/branch_fallthrough.flix"
              Expected = "Two"
            }
          )

          foreach ($test in $tests) {
            Write-Host "Testing $($test.File)"

            & $compiler check $test.File
            if ($LASTEXITCODE -ne 0) {
              throw "Syntax check failed: $($test.File)"
            }

            $output = "test-output.exe"
            & $compiler build $test.File -o $output

            if ($LASTEXITCODE -ne 0) {
              throw "Compilation failed: $($test.File)"
            }

            $actual = & ".\$output"
            if ($LASTEXITCODE -ne 0) {
              throw "Program execution failed: $($test.File)"
            }

            $actualText = ($actual -join "`n").Trim()

            if ($actualText -ne $test.Expected) {
              throw "Unexpected output for $($test.File). Expected '$($test.Expected)', got '$actualText'."
            }

            Remove-Item $output -ErrorAction SilentlyContinue
            Remove-Item "test-output.generated.cpp" -ErrorAction SilentlyContinue
          }

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          Copy-Item build/bin/Release/flix.exe dist/flix.exe
          Copy-Item build/bin/Release/flixc.exe dist/flixc.exe

          if (!(Test-Path dist/flix.exe)) {
              throw "Flix interpreter was not generated."
          }

          if (!(Test-Path dist/flixc.exe)) {
              throw "Flix compiler was not generated."
          }
      
      - name: Generate Flix Library
        shell: pwsh
        run: |
          ./tools/New-Flib.ps1 -OutputPath dist/flix.flib

          if (!(Test-Path dist/flix.flib)) {
              throw "Flix library was not generated."
          }

          $bytes = [System.IO.File]::ReadAllBytes("dist/flix.flib")

          if ([System.Text.Encoding]::ASCII.GetString($bytes[0..3]) -ne "FLIB") {
              throw "Invalid FLIB signature."
          }

          Write-Host "Flix library validated successfully."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/flix.exe `
            dist/flixc.exe `
            dist/flix.flib `
            --title "Flix ${{ github.ref_name }}" `
